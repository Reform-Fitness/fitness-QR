<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>წევრობის სტატუსი</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            color: #222;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            color: #ff3b30;
            margin-bottom: 25px;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .info {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            text-align: left;
        }

        .label {
            color: #777;
            font-size: 14px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #e8f8ed;
            color: #16803c;
            font-size: 20px;
            font-weight: bold;
        }

        .entry {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: #e8f8ed;
            color: #16803c;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Reforma Fitness</h1>

        <div class="name">
            ლუკა ბერიძე
        </div>

        <div class="info">
            <div class="label">წევრობის დაწყება</div>
            <div class="value">05.09.2026</div>
        </div>

        <div class="info">
            <div class="label">ვადა გასდის</div>
            <div class="value">05.10.2026</div>
        </div>

        <div class="status">
            🟢 წევრობა აქტიურია
        </div>

        <div class="entry">
            ✅ შემოსვლა ნებადართულია
        </div>

        <div class="footer">
            Reforma Fitness • წევრობის შემოწმება
        </div>

    </div>

</body>
</html>
