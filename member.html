<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>წევრობის სტატუსი</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: white;
    color: #222;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
}

h1 {
    color: #ff3b30;
    margin-bottom: 25px;
}

.name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
}

.info {
    background: #f4f4f4;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    text-align: left;
}

.label {
    color: #777;
    font-size: 14px;
}

.value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.status,
.entry {
    margin-top: 10px;
    padding: 15px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

.active {
    background: #e8f8ed;
    color: #16803c;
}

.expired {
    background: #ffe8e8;
    color: #d00000;
}

.footer {
    margin-top: 25px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

    <h1>Reforma Fitness</h1>

    <div class="name">
        ლუკა ბერიძე
    </div>

    <div class="info">
        <div class="label">წევრობის დაწყება</div>
        <div class="value">05.09.2026</div>
    </div>

    <div class="info">
        <div class="label">ვადა გასდის</div>
        <div class="value">05.10.2026</div>
    </div>

    <div id="status" class="status">
        შემოწმება...
    </div>

    <div id="entry" class="entry">
        შემოწმება...
    </div>

    <div class="footer">
        Reforma Fitness • წევრობის შემოწმება
    </div>

</div>

<script>

const expiryDate = "2026-10-05";

const today = new Date();

const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, "0");
const dd = String(today.getDate()).padStart(2, "0");

const todayString = `${yyyy}-${mm}-${dd}`;

const status = document.getElementById("status");
const entry = document.getElementById("entry");

if (todayString <= expiryDate) {

    status.textContent = "🟢 წევრობა აქტიურია";
    status.className = "status active";

    entry.textContent = "✅ შემოსვლა ნებადართულია";
    entry.className = "entry active";

} else {

    status.textContent = "🔴 წევრობა ვადაგასულია";
    status.className = "status expired";

    entry.textContent = "🚫 შემოსვლა აკრძალულია";
    entry.className = "entry expired";

}

</script>

</body>
</html>
